name: ci
on: [push, pull_request]
jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: ./devboard.py --selftest
      - run: ./devboard.py .. --smoke   # the checkout's parent: a folder holding one repo
